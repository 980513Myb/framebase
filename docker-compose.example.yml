services:
  framebase:
    build: .
    image: framebase:local
    container_name: framebase
    restart: unless-stopped
    ports:
      - "5256:5256"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # FrameBase persistent directories. Use absolute NAS paths when needed.
      - ./config:/app/config
      - ./backups:/app/backups
      - ./fonts:/app/fonts
      - ./templates:/app/templates
      - ./layouts:/app/layouts

      # 真实库媒体路径映射。
      # 请把左侧改成宿主机上的真实媒体目录，右侧建议填写 Emby 容器中对应媒体库使用的路径。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5256/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
